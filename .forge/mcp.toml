# The funcut MCP server, declared for the Forge harness.
#
# Running `forge` from this repository wires it to Concat with no further
# setup: the project's .forge/mcp.toml is read after a one-time trust prompt.
# At user scope instead - so it works from anywhere:
#
#   forge mcp add funcut concat -- --mcp window -s user
#
# call_timeout_secs is the CLIENT-side bound, and it stays one number:
# the SERVER bounds each tool by its own limit instead (concat-mcp's
# Tool::timeout_secs - the VLM download and the overlay encode 1200 s,
# transcribe 900 s, exports and the sense family 600 s, the renders and
# the watches 300 s, everything else 60 s), so 900 s is the ceiling over
# all of them rather than the answer for each. A tool that outlives its
# own limit is cancelled and answered for at the deadline.

call_timeout_secs = 900

[[servers]]
name = "funcut"

[servers.transport]
type = "stdio"
command = "concat"
# The open window's server when it is serving (Settings > Automation >
# Scripts and apps), an API in this process otherwise.
args = ["--mcp", "auto"]

# THE ALLOWLIST IS PER TOOL NOW, NOT PER SERVER. The server carries the
# net, two ways to switch it on:
#
#   - the binary's flag, for a server started by hand:
#       concat-mcp auto --mcp-allow timeline_read,clip_add,...
#   - the environment, for this window's server (which `concat --mcp`
#     runs) and for anything else that starts it:
CONCAT_MCP_ALLOW=analysis_wait,analyze_beats,analyze_scenes,analyze_silence,bgm_fetch,bgm_import,bgm_prepare,bgm_search,bgm_status,captions_add,captions_animate,clip_add,clip_audio_levels_db,clip_cut_spans,clip_frame,clip_mask,clip_speed,clip_stabilize,clip_transform,clip_trim,clip_update,clips_add_sequence,clips_move,clips_remove,clips_split,collision_check,concat_version,craft_critique,creative_brief,edit_apply,edit_redo,edit_undo,effect_key_set,effect_layer_add,effects_list,emotion,export_start,export_status,export_wait,keyframe_clear,keyframe_set,local_vlm,magick_add,magick_fetch,magick_prepare,magick_search,magick_status,measure_loudness,media_import,media_probe,models_list,motion_bake,motion_frame,motion_inspect,motion_overlay,motion_presets,motion_reel,openvid_fetch,openvid_get,openvid_import,openvid_prepare,openvid_search,openvid_search_batch,openvid_status,plan_validate,preview_frame,project_create,project_get,project_list,project_open,project_save,project_set_video,sounds_add,sounds_search,stock_contact_sheet,suggest_cuts,template_instantiate,template_list,timeline_background,timeline_read,title_add,track_add,transcribe,tts_generate,watch_render
#
# A tool not on the list is refused as if it were not there - its
# description still lists it, but the surface served is what the operator
# said, not what the build happens to carry. CONCAT_MCP_READ_ONLY=1 is
# the other switch: every tool that changes something is refused, except
# motion_reel's plan, frame and sheet halves, which are how an agent looks.
#
# The list this repository means is the director's creative loop, ready
# to paste: 86 of the 89 tools, the three left off being the ones a
# harness never needs by surprise - models_download (gigabytes, on its
# own say-so), project_close (drops the session's whole project) and
# export_cancel (cancels a render someone else is watching). Take one
# back by naming it; take more off the same way.
#
CONCAT_MCP_ALLOW=analysis_wait,analyze_beats,analyze_scenes,analyze_silence,bgm_fetch,bgm_import,bgm_prepare,bgm_search,bgm_status,captions_add,captions_animate,clip_add,clip_audio_levels_db,clip_cut_spans,clip_frame,clip_mask,clip_speed,clip_stabilize,clip_transform,clip_trim,clip_update,clips_add_sequence,clips_move,clips_remove,clips_split,collision_check,concat_version,craft_critique,creative_brief,edit_apply,edit_redo,edit_undo,effect_key_set,effect_layer_add,effects_list,emotion,export_start,export_status,export_wait,keyframe_clear,keyframe_set,local_vlm,magick_add,magick_fetch,magick_prepare,magick_search,magick_status,measure_loudness,media_import,media_probe,models_list,motion_bake,motion_frame,motion_inspect,motion_overlay,motion_presets,motion_reel,openvid_fetch,openvid_get,openvid_import,openvid_prepare,openvid_search,openvid_search_batch,openvid_status,plan_validate,preview_frame,project_create,project_get,project_list,project_open,project_save,project_set_video,sounds_add,sounds_search,stock_contact_sheet,suggest_cuts,template_instantiate,template_list,timeline_background,timeline_read,title_add,track_add,transcribe,tts_generate,watch_render

[allow]
servers = ["funcut"]
