[package]
name = "concat-motion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Motion comps: the document model, the curves, and the engines that bake one into an RGBA frame sequence."

[features]
default = ["raster"]
# The native engine: a CPU raster compositor over tiny-skia, with the
# shaped-run text path from concat-text. Default because the fallback
# story needs it - a machine without the Geneva sidecar bakes comps on
# this engine, so it is only optional for builds that render nothing.
raster = [
    "dep:tiny-skia",
    "dep:concat-text",
    "dep:png",
    "dep:jpeg-decoder",
    "dep:image-webp",
    "dep:base64",
    "dep:rasterlottie",
    "dep:zip",
]
# JSON Schema for the plan's own types, so the canonical edit-plan schema
# is generated from what the validator actually deserializes instead of
# being hand-maintained beside it (SCH-02). What concat-mcp splices into
# edit_plan.schema.json rides this feature.
schema = ["dep:schemars"]
# The software 3D scene: .glb/.gltf meshes, extruded type and lit surfaces
# rasterized on the CPU beside the 2D stack, so a 4 GB laptop without a
# GPU still renders them. Off by default because the glTF and glyph
# parsers are only worth their compile time when a project asks for 3D.
scene3d = ["dep:gltf", "dep:ttf-parser", "raster"]

[dependencies]
# The comp document is JSON a template, an agent or the editor writes; serde
# is the whole format layer, and nothing here needs a pixel.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
# The plan types' JSON Schema, behind the `schema` feature: the canonical
# edit-plan schema is generated from these types so it cannot drift from
# what the validator deserializes. The same workspace pin concat-project
# and concat-api generate their request schemas with.
schemars = { workspace = true, optional = true }
# The footage planner's engine room: gap coverage and B-roll selection,
# colour-continuity flags and cut positions come from oximedia-auto rather
# than being rebuilt here. Pinned patch-exact, like ort above: the planning
# layer wires this one version's API, and a patch bump may change it
# underneath without a commit saying so.
oximedia-auto = "=0.1.8"
# The planner's own clock: Timestamp and Rational from the core, the same
# types oximedia-auto's beats and cuts carry, so a beat never crosses a
# timebase boundary on the way in or out.
oximedia-core = "0.1.8"
# The raster behind the native engine, and the image decodes it reads:
# the same versions concat-text and the window already build against, so
# the lock does not move. png-format because a bake is a PNG sequence.
tiny-skia = { version = "0.12", features = ["png-format"], optional = true }
# The shaped-run text path: faces, shaping, bidi, wrapping and the
# outlines a text node paints, the same one the window's titles use.
concat-text = { workspace = true, optional = true }
# Still decode: the formats an image asset may be.
png = { workspace = true, optional = true }
jpeg-decoder = { version = "0.3", optional = true }
image-webp = { version = "0.2", optional = true }
# Pure-Rust Lottie rasterizer with an explicit support analyzer and image/text support.
rasterlottie = { version = "0.2.4", default-features = false, features = ["images", "text"], optional = true }
base64 = { version = "0.23", optional = true }
# dotLottie archive inspection is bounded before parsing; no archive paths are extracted.
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
# The 2.5D/3D transform chain: rotate_x/rotate_y, z depth, perspective and
# the camera rig all compose through glam's 4x4 matrices before the
# projective pass hands a homography to the raster. Small, allocation-free
# where it matters, and the whole crate already speaks f64.
glam = "0.30"
# Boolean vector ops, variable-width stroke ribbons and the tessellated
# glyph fronts and sides of extruded type: the geometry helpers the path
# work needs, pure Rust with no system libraries.
lyon = "1"
# The comp template preprocessor: {% for %}, {% if %} and JSON data
# injection before the document is parsed, so a shelf of comps can share
# one parameterised source. minijinja is the smallest engine that speaks
# the Jinja dialect authors already know.
minijinja = "2"
# Shared-memory frame transport (memfd_create, POSIX shm, mmap) with safe
# wrappers - the crate carries no unsafe of its own and this keeps it that
# way. The sidecar seam reads and writes frame bytes without a PNG round
# trip when both ends agree on the protocol.
rustix = { version = "1", default-features = false, features = ["std", "mm", "shm", "system"] }
# glTF parsing for NodeKind::Scene3D, behind the scene3d feature: meshes,
# materials and node trees out of .glb/.gltf binaries. Image decode stays
# with the crate's own png/jpeg readers, so no extra decoder rides along.
gltf = { version = "1", default-features = false, features = ["import"], optional = true }
# Glyph outlines for 3D extruded typography, behind the scene3d feature:
# the same parser every Rust font stack uses, no rasterizer attached.
ttf-parser = { version = "0.25", optional = true }

[lints]
workspace = true

[dev-dependencies]
# The guard tests write stub executables into a throwaway directory.
tempfile = "3"
