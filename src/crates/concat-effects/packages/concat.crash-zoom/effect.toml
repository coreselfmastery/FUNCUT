format = 2

[effect]
id = "concat.crash-zoom"
name = "Crash Zoom"
kind = "transition"
category = "Viral Zoom"
shelves = ["Zoom"]
order = 22
description = "Both pictures slam through each other at once - the documentary crash zoom, hard and fast."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "zoomin"
fallback = "zoom"

[card]
progress = 0.3
