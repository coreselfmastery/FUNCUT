name: Nix

# Proves the flake: `nix build` on Linux whenever the flake, the lock, or
# the workspace's dependencies change, and on demand. The lock is the
# repository's and is refreshed by hand - `nix flake lock`, committed under
# the author's own name - so the job builds exactly what is checked in and
# fails, saying so, when the lock has fallen behind the flake.
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - src/Cargo.lock
      - src/Cargo.toml
      - src/crates/*/Cargo.toml
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - src/Cargo.lock
      - .github/workflows/nix.yml
  workflow_dispatch:

# Only a pull request's run is superseded by the next push to it; a run on
# main is the record of whether main builds.
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix build
    runs-on: ubuntu-24.04
    # A cold build of the whole workspace and its native dependencies.
    timeout-minutes: 120
    # Read only: the job builds what is checked in and writes nothing back
    # (the lock is refreshed by hand; see the top of this file).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # The window crate's rustc has outgrown the builder three cures in a
      # row now - the codegen-units ladder (sixteen, thirty-two, sixty-four,
      # now one hundred and twenty-eight), then one core instead of four -
      # and the last runs still end "rustc was terminated by a deadly
      # signal", one process, no neighbour, dead the same way each time.
      # The evidence, gathered from four dead runs and one live one:
      #
      #   - The image is the same one that passed: 20261028.624 on the green
      #     run of 11 November and on every red one after it, so this is not
      #     an image update underneath us.
      #   - The runner already has swap now ("swap already present" -
      #     three gigabytes of it, which satisfied the guard, not the eight
      #     the cure meant), and rustc is killed anyway - so the swap cure
      #     of the last commit never actually landed, and the machine held
      #     fifteen of RAM and three of swap, not the fifteen-plus-eight
      #     the cure was written for. A deadly
      #     signal to a single rustc with swap available is what a full disk
      #     gives: the rlib is written through a mapping, and the write fault
      #     that cannot be served kills the process (SIGBUS) rather than
      #     erroring. Upstream Concat's Nix lane died the same death the same
      #     week (their window crate grew by 2,700 lines between their last
      #     green run and their first red one; ours grew by 1,900), and the
      #     runner-images repo has Rust CI disk exhaustion on record as
      #     #13367 (closed as a duplicate of the standing disk-space issue).
      #   - GitHub guarantees only ~14 GB free, and this build fills it: the
      #     whole workspace compiles into one sandboxed target dir - every
      #     rlib, with thin-LTO bitcode beside the native code - while the
      #     Nix store grows its own multi-gigabyte share beside it, on the
      #     same disk.
      #
      # So before building: say what the machine actually has (memory, swap,
      # disk, the build's limits - so the next failure names its cause
      # instead of guessing), make sure swap exists (the earlier cure, kept,
      # now that it can be told apart from the disk), and clear the ~20 GB
      # of preinstalled SDKs this job never touches - Android, dotnet, GHC,
      # CodeQL, boost - which is where the room comes from. The ladder's
      # next rung is climbed beside all of this in src/Cargo.toml, where it
      # has always lived: the window crate's units are the manifest's
      # [profile.release.package.concat] override, which beats the flake's
      # CARGO_PROFILE_RELEASE_CODEGEN_UNITS env var - so the env var never
      # governed the crate that was dying, and the manifest's sixty-four is
      # now one hundred and twenty-eight, every piece half the size again,
      # the same cure the knob gave every time the module outgrew it. One
      # cure for the memory, one for the disk: the next run's diagnostics
      # say which one was binding. And the run at a29f44ad added its own
      # answer to half of that: the guard below answered "is there any
      # swap" where the cure asked "is there the eight gigabytes", so
      # the runner's default three satisfied it and the file never landed
      # - every red run since built on eighteen gigabytes of memory, not
      # the twenty-three the cure meant. The guard now measures what is
      # there and adds the eight whenever less is present, and a build
      # that dies prints the machine at its death beside the kernel's own
      # record of the kill - so the next cure targets the constraint that
      # was binding, not the one that was last time.
      - name: Room for the build
        run: |
          echo "== memory =="; free -h
          echo "== swap =="; swapon --show || true
          echo "== disk before =="; df -h / /mnt || true
          echo "== the build's own limits =="; ulimit -a
          # The cure meant eight gigabytes, not "some swap exists": the
          # guard that shipped answered the second question and skipped
          # the fallocate on the runner's default three every time.
          swap_kib() { awk 'NR>1 { sum += $3 } END { print sum + 0 }' /proc/swaps; }
          had_kib=$(swap_kib)
          if [ "$had_kib" -lt 8388608 ]; then
            for where in /mnt /; do
              if sudo fallocate -l 8G "$where/swapfile" 2>/dev/null; then
                sudo chmod 600 "$where/swapfile"
                sudo mkswap "$where/swapfile"
                sudo swapon "$where/swapfile"
                echo "swap on at $where/swapfile, beside the ${had_kib} KiB that was already there"
                break
              fi
            done
          fi
          swapon --show || echo "no swap at all; building on RAM alone" >&2
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /var/lib/apt/lists/*
          echo "== disk after =="; df -h / /mnt || true

      # Refreshes nothing: a lock that would change here is a lock the
      # commit should have carried.
      - name: The lock matches the flake
        run: |
          nix flake lock
          if ! git diff --quiet flake.lock; then
            echo "flake.lock is behind flake.nix: run 'nix flake lock' and commit the result" >&2
            git --no-pager diff flake.lock
            exit 1
          fi

      - name: Build
        run: |
          if nix build .#concat --print-build-logs; then
            exit 0
          fi
          # A build that died says what the machine held when it died:
          # memory, swap, disk, and the kernel's own record of the kill,
          # so the next cure targets the constraint that was binding
          # instead of the one that was last time.
          echo "== the machine at the failure =="; free -h
          swapon --show || true
          df -h / /mnt || true
          sudo dmesg | tail -n 40 || true
          exit 1

      # A window cannot open on the runner, so the check is that the binary
      # is there, links, and resolves every library it needs.
      - name: Check the binary links
        run: |
          file result/bin/.concat-wrapped || file result/bin/concat
          ldd result/bin/.concat-wrapped 2>/dev/null | grep -i 'not found' && exit 1 || true
