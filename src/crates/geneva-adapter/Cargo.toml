[package]
name = "geneva-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Motion made elsewhere, read here: Lottie documents and GSAP-style timelines adapted to the comp format the engines already bake."

[dependencies]
# The adapters write comps and only comps: the document model, its curves
# and its tracks are the whole target vocabulary, and nothing here needs a
# pixel or a file the caller did not already hand over.
concat-motion = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
# The SVG importer's parser: groups, paths, fills, gradients and transforms
# resolved to the same geometry vocabulary the comp already carries. Default
# features off - system font resolution is not an importer's job, and <text>
# elements are said rather than shaped (the comp's text is a text node with
# its own style).
usvg = { version = "0.45", default-features = false }
# The path algebra usvg hands back - the same version it builds against,
# re-declared so the importer can name the segment type it matches on.
tiny-skia-path = "0.11"

[lints]
workspace = true

[dev-dependencies]
# The fixture tests write throwaway comp and lottie files.
tempfile = "3"
