[package]
name = "concat-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "What the editor window needs that is not the edit itself: sessions, project folders, previews, playback, templates."

[features]
# The wgpu compositor for previews and exports, off by default for the same
# reason as everywhere else in the engine; the window turns it on.
gpu = ["concat-export/gpu", "concat-render/gpu"]

[dependencies]
concat-core.workspace = true
concat-media.workspace = true
concat-project.workspace = true
concat-export.workspace = true
# The effect cards: every picture package drawn by its own shader; see
# cards.rs.
concat-effects.workspace = true
# Titles become pictures here; see titles.rs.
concat-text.workspace = true
# The cutout models and their masks; `infer` because the host is what
# runs them, and ureq because the host is what fetches them.
concat-vision = { workspace = true, features = ["infer"] }
# An enhanced still is written as a PNG: lossless, since the point was
# the detail.
png = "0.17"
ureq = "2"
# The TLS ureq speaks, configured here to trust the system's roots beside
# the shipped ones; see net.rs. The same rustls, ring and webpki-roots as
# ureq's, so nothing is built twice.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
# A finished download is checked against the digest its table carries
# before anything is allowed to call it installed; see models.rs.
sha2 = "0.10"
# The OpenVid stock library's local index: every clip's caption, scores
# and byte range in one SQLite file, searched in milliseconds. Bundled, so
# no system SQLite is asked for and every platform gets the same one, FTS5
# included.
rusqlite = { version = "0.40", features = ["bundled"] }
# The index's captions are zstd-compressed against a dictionary the index
# itself carries; decompressed a page at a time, never whole.
zstd = "0.14"
# The background-music library's Lo-Fi shelf reads its tracks out of the
# pack's one zip on a GitHub release with ranged reads: the members are
# deflated, and each one is inflated and checked against the CRC the zip's
# own directory carries. The Rust backend, so no C is built for it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The same CRC-32 the zip carries, to check a fetched track against: the
# crate flate2's own backend already brings in, named here for what it is.
crc32fast = "1"
# The log facade. The engine writes `log::warn!` and logs.rs is what puts
# the line in a file; a phone puts it in logcat as well.
log = { version = "0.4", features = ["std"] }
# The CPU compositor draws the monitor's frame; the wgpu one is behind
# `gpu`, so a headless host pays for no GPU tree.
concat-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

# Engine-owned audio playback: cpal talks to the output device, memmap2 keeps
# decoded PCM disk-backed instead of resident.
cpal = "0.16"
memmap2 = "0.9"

# The machine's memory, for sizing the caches to it; see memory.rs; and
# the crash handler's signals, the lock file's flock, the tripwire's kill.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
