format = 2

[effect]
id = "concat.jelly-wobble"
name = "Jelly Wobble"
kind = "transition"
category = "Meme & Bounce"
order = 105
description = "The new shot lands with a wobble like set jelly, the seam jiggling as it settles."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 45
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "smoothdown"
fallback = "push"

[card]
progress = 0.5
