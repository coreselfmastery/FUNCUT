format = 2

[effect]
id = "concat.exposure-slam"
name = "Exposure Slam"
kind = "transition"
category = "Flash & Impact"
order = 85
description = "A hard exposure ramp that slams the new shot in bright and falls back to level."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "fadefast"
fallback = "cross-fade"

[card]
progress = 0.35
