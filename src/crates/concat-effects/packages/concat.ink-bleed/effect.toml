format = 2

[effect]
id = "concat.ink-bleed"
name = "Ink Bleed"
kind = "transition"
category = "Organic"
order = 90
description = "The new shot bleeds through the old like ink through paper, ragged and soft."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 45
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "dissolve"
fallback = "cross-fade"

[card]
progress = 0.4
