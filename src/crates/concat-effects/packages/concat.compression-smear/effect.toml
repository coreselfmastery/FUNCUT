format = 2

[effect]
id = "concat.compression-smear"
name = "Compression Smear"
kind = "transition"
category = "Glitch"
order = 43
description = "Sixteen rows of blocky smear, as if the bitstream gave up exactly at the cut."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "pixelize"
fallback = "cross-fade"

[card]
progress = 0.4
