format = 2

[effect]
id = "concat.track-jump"
name = "Track Jump"
kind = "transition"
category = "Glitch"
order = 42
description = "The tape jumps its track in three thick bands - a VHS crash cut for retro segments."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "hlslice"
fallback = "cross-fade"

[card]
progress = 0.4
