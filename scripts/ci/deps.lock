# The prebuilt dependencies CI downloads, each pinned to one file and the
# sha256 of its bytes. scripts/ci/fetch.sh is the only thing that reads
# this, and it refuses a file whose digest is not the one written here.
#
#   name  url  sha256
#
# To bump one: change the URL, run `scripts/ci/fetch.sh NAME /tmp/x`, and
# put the digest it reports in place of the old one. Where a version is
# also named elsewhere, change it there too; the comment above each group
# says where.

# FFmpeg 8.1, BtbN's GPL shared builds. A month's last autobuild, not
# `latest`: BtbN keeps those, where the daily ones are deleted after a
# fortnight, and `latest` changes under a build every day.
ffmpeg-linux64      https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-shared-8.1.tar.xz      76649c19a7a4615b367251ba4a8adc643f65831278a00e7a0c38398f7f06484b
