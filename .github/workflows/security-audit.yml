name: Dependency security audit

# This PR is stacked on the dependency-upgrade branch: audit its merged lockfile
# before deciding whether any remaining advisory needs a narrowly justified exception.

on:
  push:
    branches: [main]
    paths:
      - 'src/Cargo.lock'
      - 'src/**/Cargo.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'src/Cargo.lock'
      - 'src/**/Cargo.toml'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: RustSec dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the repository's pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Install pinned cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit the committed dependency lockfile
        run: cargo audit --file src/Cargo.lock
