#
# A tool not on the list is neither listed nor called - the surface
# served is what the operator said, not what the build happens to carry.
# CONCAT_MCP_READ_ONLY=1 is the other switch: every tool that changes
# something is refused, except motion_reel's plan, frame and sheet
# halves, which are how an agent looks.
#
# THE WHOLE CATALOGUE, when a specialist needs it: CONCAT_MCP_ALLOW=all
# (or --full-tools, or --mcp-allow all) serves every tool the build
# carries. The ten the director's default leaves off are the ones a
# director never calls by surprise - project_close (drops the session's
# whole project), export_cancel (cancels a render someone else is
# watching), the farm pair (motion_farm_cloud, motion_farm_progress),
# the specialist motion reads (motion_probe, motion_preview,
# scene_analysis, scene_timeline), track_subject and geneva_explain -
# each one a deliberate opt-in, not a missing piece.
#
# CONCAT_MCP_ALLOW=all
#
