[package]
name = "concat-motion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Motion comps: the document model, the curves, and the engines that bake one into an RGBA frame sequence."

[dependencies]
# The comp document is JSON a template, an agent or the editor writes; serde
# is the whole format layer, and nothing here needs a pixel.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The guard tests write stub executables into a throwaway directory.
tempfile = "3"
