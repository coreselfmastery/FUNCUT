format = 2

[effect]
id = "concat.whip-up"
name = "Whip Up"
kind = "transition"
category = "Whip & Pan"
shelves = ["Slide", "Push"]
order = 32
description = "The camera whips up so fast the shot smears, and the new one is there when the eye lands."

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 45
step = 1
unit = "%"

[[param]]
key = "fade"
label = "Seam dim"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "slideup"
fallback = "push"

[card]
progress = 0.45
