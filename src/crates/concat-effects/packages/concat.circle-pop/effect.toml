format = 2

[effect]
id = "concat.circle-pop"
name = "Circle Pop"
kind = "transition"
category = "Shape Reveal"
order = 50
description = "A circle springs open with elastic overshoot and a white rim - the classic pop reveal."

[[param]]
key = "size"
label = "Size"
min = 20
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "edge"
label = "Rim glow"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "circleopen"
fallback = "cross-fade"

[card]
progress = 0.35
