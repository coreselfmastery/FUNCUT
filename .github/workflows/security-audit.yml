name: Dependency security audit

# No advisories are ignored: the sherpa-onnx 2.x migration (PR #173, merged)
# cleared the last of them. zip 2.4.2 (four advisories) and the zstd/zstd-safe
# pair riding its optional feature sat in the sherpa-onnx-sys 1.13.7
# build-dependency subtree, which the supported build never executes - its
# build.rs opens an archive only on the iOS .xcframework path, a Linux-only
# product never takes it, SHERPA_ONNX_LIB_DIR (always set by the supported
# env, scripts/funcut-env.sh) returns before the download path is reached,
# and the prebuilt archives are sha256-verified against scripts/ci/deps.lock
# first. sherpa-onnx-sys 2.0.2 builds against zip 9 instead, so the subtree
# no longer carries a vulnerable zip and the seven per-ID ignores that stood
# in for the migration are gone. Any new advisory fails the audit.

on:
  push:
    branches: [main]
    paths:
      - 'src/Cargo.lock'
      - 'src/**/Cargo.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'src/Cargo.lock'
      - 'src/**/Cargo.toml'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: RustSec dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the repository's pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Install pinned cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit the committed dependency lockfile
        run: cargo audit --file src/Cargo.lock

