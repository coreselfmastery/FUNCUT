[package]
name = "concat-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Concat for AI agents: an MCP server over stdio whose tools are the Concat API's methods, with schemas generated from its request types."

[dependencies]
# The one source of editing semantics. `schema` gives each request and each
# edit command its JSON Schema, which is what a tool's arguments are; `speech`
# brings the transcription and voice tools - this server serves agents, and
# agents are given senses.
concat-api = { workspace = true, features = ["schema", "speech"] }
# The window's server, reached as a client, and the file that says where
# it is.
concat-server.workspace = true
# The motion layer the five motion tools wrap: presets, comps, frames,
# bakes and word-timed caption reels - the design door an agent had no way
# through before, which the director skill's Phase 5b always assumed.
concat-motion.workspace = true
serde_json.workspace = true
# The reel contact sheet decodes and encodes PNG frames: the same crate
# the API's frame method hands back through.
png.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
